[metadata]
name = aws-devops-agent-acp
version = 1.0.0
author = AWS
description = AWS DevOps Agent — sample ACP client, ACP server, and MCP server for AI-powered operational intelligence
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT-0
license_files = LICENSE.txt
classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: Developers
    License :: OSI Approved :: MIT No Attribution License (MIT-0)
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10
install_requires =
    boto3>=1.35.0

[options.packages.find]
where = src


[options.extras_require]
mcp =
    mcp[cli]>=1.2.0
dev =
    pytest>=8.0
    pytest-cov>=4.0
    coverage>=7.0
all =
    mcp[cli]>=1.2.0
    pytest>=8.0

[options.entry_points]
console_scripts =
    aws-devops-agent = aws_devops_agent.cli:main
    aws-devops-agent-mcp = aws_devops_agent.mcp_server:main
    aws-devops-agent-acp = aws_devops_agent.acp_server:main

[tool:pytest]
testpaths = tests

[flake8]
max-line-length = 100

[mypy]
ignore_missing_imports = True
